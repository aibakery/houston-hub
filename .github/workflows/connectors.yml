name: Connector bundle tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Check bundle manifests, layout and icons
        run: |
          go test ./tools/validate
          go run ./tools/validate
      - name: Download the public Houston test runner
        run: |
          curl --fail --silent --show-error --location --retry 3 https://ok-houston.com/cli/houston-linux-amd64 --output /tmp/houston
          chmod +x /tmp/houston
      - name: Run every bundle test without credentials
        run: /tmp/houston test-connectors .
