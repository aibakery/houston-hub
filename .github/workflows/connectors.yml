name: Connector tooling and source policy
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Install pinned source-policy checker
        run: go install github.com/gdevillele/vet/implementations/go/cmd/vet@v0.0.0-20261008175238-57a10e5335e7
      - name: Check shared manifest and image contracts
        run: go test ./manifest ./assets
      - name: Require Luau bundles and shared tooling
        run: vet -c vet.yaml
