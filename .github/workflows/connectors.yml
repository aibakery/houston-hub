name: Connector source policy
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - name: Install pinned source-policy checker
        run: go install github.com/gdevillele/vet/implementations/go/cmd/vet@v0.0.0-20261008175238-57a10e5335e7
      - name: Require Luau source and approved supporting files
        run: vet -c vet.yaml
