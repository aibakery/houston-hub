# Bundle code is Luau; shared Go tooling validates every connector.
version: 1
rules:
  # This policy controls source languages. Go APIs are checked by go vet/test.
  max-function-parameters:
    enabled: false
  forbidden-files:
    enabled: true
    reason: "Keep connector implementations and tests in Luau; Go belongs only in shared tooling"
    patterns:
      - "**/*"
    exclude:
      - "**/*.luau"
      - "**/*.lua"
      - "**/*.md"
      - "**/*.json"
      - "**/*.svg"
      - "**/*.png"
      - "assets/*.go"
      - "manifest/*.go"
      - "tools/*/*.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/*.yml"
      - "vet.yaml"
      - ".gitignore"
      - "LICENSE"
